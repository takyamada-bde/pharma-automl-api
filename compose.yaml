services:
  postgres:
    image: tyamadabiodataeng/pharma-automl-api-postgres
    build:
      context: ./postgres
      dockerfile: ../dockerfiles/postgres/Dockerfile
    environment:
      - TZ=Asia/Tokyo
    env_file:
      - ./postgres/.env
    ports:
      - "5432:5432"
    volumes:
      - pharmaautomlapi_pg_data:/var/lib/postgresql
    networks:
      - pharmaautomlapi-network
  fastapi:
    image: tyamadabiodataeng/pharma-automl-api-fastapi
    build:
      context: ./app
      dockerfile: ../dockerfiles/fastapi/Dockerfile
    command: uvicorn main:app --host=0.0.0.0 --port=8000
    volumes:
      - ./app:/app
    expose:
      - "8000"
    depends_on:
      - postgres
    networks:
      - pharmaautomlapi-network
  nginx:
    image: tyamadabiodataeng/pharma-automl-api-nginx
    build: 
      context: ./nginx
      dockerfile: ../dockerfiles/nginx/Dockerfile
    volumes:
      - ./app/static:/usr/src/static
      - ./app/media:/usr/src/media
    ports:
      - "80:80"
    depends_on:
      - fastapi
    networks:
      - pharmaautomlapi-network

networks:
  pharmaautomlapi-network:
    driver: bridge

volumes:
  pharmaautomlapi_pg_data:
