[workspace]
channels = ["conda-forge", "bioconda"]
name = "automl-api-jupyter"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
lab = "jupyter lab --ip=0.0.0.0 --allow-root --LabApp.token=''"

[dependencies]
python = "3.12.*"
black = "*"
ruff = "*"
mypy = "*"
tox = "*"
structlog = "*"
pytest = "*"
pytest-snapshot = "*"
line_profiler = "*"
memory_profiler = "*"
mkdocs = "*"
numpy = "*"
matplotlib = "*"
openpyxl = "*"
pandas = "*"
polars-lts-cpu = "*"
ibis-framework = "*"
seaborn = "*"
requests = "*"
jupyterlab = "*"
ipywidgets = "*"
ipympl = "*"
ipytest = "*"
pandera = "*"
rdkit = "*"
anndata = "*"
scanpy = "*"
r-base = "*"
r-essentials = "*"
r-rlang = "*"
r-tidyverse = "*"
r-irkernel = "*"
r-biocmanager = "*"
bioconductor-biocgenerics = "*"
bioconductor-biocversion = "*"
bioconductor-biobase = "*"
bioconductor-anndatar = "*"
